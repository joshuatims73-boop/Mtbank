name: Build M.Tbank APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download project
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract M.Tbank project
        run: |
          mkdir buildsrc
          unzip -o *.zip -d buildsrc

      - name: Build APK
        working-directory: buildsrc
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: M.Tbank-Demo-APK
          path: buildsrc/app/build/outputs/apk/debug/app-debug.apk
